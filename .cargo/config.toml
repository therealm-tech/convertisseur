# Development defaults for the docker-compose stack. Cargo sets these only for
# what it spawns (`cargo run`, `cargo test`), not for
# ./target/debug/convertisseur-api run by hand or the binary in a container; a
# variable already set in the environment wins.
[env]
DATABASE_URL = "postgres://convertisseur:convertisseur@localhost:5434/convertisseur"
BIND_ADDR = "127.0.0.1:3000"
WEBAPP_DIR = { value = "convertisseur-webapp/dist", relative = true }
# The local server speaks plain HTTP, where a Secure cookie is not sent back.
COOKIE_SECURE = "false"
# The throwaway super admin of the local stack.
SUPER_ADMIN_USERNAME = "admin"
SUPER_ADMIN_PASSWORD = "convertisseur-admin"
# The compose SeaweedFS and its development-only credentials.
S3_ENDPOINT = "http://localhost:8333"
S3_BUCKET = "convertisseur"
S3_ACCESS_KEY_ID = "convertisseur"
S3_SECRET_ACCESS_KEY = "convertisseur"
S3_FORCE_PATH_STYLE = "true"
