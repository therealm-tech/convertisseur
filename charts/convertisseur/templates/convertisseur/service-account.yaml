{{- if .Values.convertisseur.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "convertisseur.serviceAccountName" . }}
  labels:
    {{- include "convertisseur.labels" . | nindent 4 }}
  {{- with .Values.convertisseur.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
