apiVersion: v1
kind: Service
metadata:
  name: {{ include "convertisseur.fullname" . }}
  labels:
    {{- include "convertisseur.labels" . | nindent 4 }}
spec:
  type: {{ .Values.convertisseur.service.type }}
  ports:
    - name: http
      port: {{ .Values.convertisseur.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "convertisseur.selectorLabels" . | nindent 4 }}
