name: convertisseur

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: convertisseur
      POSTGRES_PASSWORD: convertisseur
      POSTGRES_DB: convertisseur
    ports:
      - 5434:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - --username=convertisseur
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    environment:
      # Development-only credentials: SeaweedFS refuses any other request.
      AWS_ACCESS_KEY_ID: convertisseur
      AWS_SECRET_ACCESS_KEY: convertisseur
    ports:
      - 8333:8333
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8333/healthz
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles:
      - app
    build:
      context: .
    environment:
      DATABASE_URL: postgres://convertisseur:convertisseur@postgres:5432/convertisseur
      SUPER_ADMIN_USERNAME: admin
      SUPER_ADMIN_PASSWORD: convertisseur-admin
      COOKIE_SECURE: "false"
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: convertisseur
      S3_ACCESS_KEY_ID: convertisseur
      S3_SECRET_ACCESS_KEY: convertisseur
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

volumes:
  postgres_data:
  seaweedfs_data:
